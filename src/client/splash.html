<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>last seen online</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:#008080;font:12px Tahoma,Arial,sans-serif;color:#171717;display:grid;place-items:center;padding:12px}.window{background:#c0c0c0;padding:3px;box-shadow:inset 1px 1px white,inset -1px -1px #202020;width:min(100%,370px);max-height:100%;display:flex;flex-direction:column}.title{background:#000080;color:white;padding:5px 7px;font-weight:bold;font-size:11px;flex:none}.content{padding:12px;background:#c0c0c0;overflow:auto;min-height:0}.contact{display:flex;align-items:center;gap:6px;border-bottom:1px solid #8b8b8b;padding-bottom:9px;font-size:11px}.lamp{width:7px;height:7px;background:#888;border:1px solid #555}.contact span:last-child{margin-left:auto;color:#4d4d4d}.message{border:2px solid;border-color:#808080 #fff #fff #808080;padding:10px;background:#fff;margin:11px 0;font-size:12px;line-height:1.6}.stamp{font-size:10px;color:#535353;margin-bottom:4px}.log{font:10px 'Courier New',monospace;color:#555;margin:5px 0 10px}button{font:inherit;padding:8px 12px;background:#c0c0c0;border:0;box-shadow:inset 1px 1px white,inset -1px -1px #222;cursor:pointer;min-height:36px}button:focus-visible{outline:2px dotted #000080;outline-offset:-4px}.actions{text-align:right}#status{font-size:11px;margin:7px 0 0;line-height:1.4}#status:empty{display:none}@media(max-width:450px){button{min-height:42px}}</style></head><body><section class="window" aria-label="recovered messenger conversation"><div class="title">messenger — leah_v</div><div class="content"><div class="contact"><i class="lamp" aria-hidden="true"></i><b>leah_v</b><span>offline</span></div><p class="log">02:02 — workstation disconnected</p><div class="message"><div class="stamp">02:17 am · leah_v</div>i’m leaving. don’t look for me.</div><div class="actions"><button id="investigate">open conversation</button></div><p id="status" role="status"></p></div></section><script type="module" src="/splash.ts"></script></body></html>
